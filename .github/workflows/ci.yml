name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-and-data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_test
          POSTGRES_USER: test_runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d integration_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Du_an_2_Breast_Cancer/backend/requirements.txt
            Du_an_2_Breast_Cancer/database/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r Du_an_2_Breast_Cancer/backend/requirements.txt
      - name: Backend tests
        run: python -m pytest -q
        working-directory: Du_an_2_Breast_Cancer/backend
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Data-service tests
        run: python -m pytest -q
        working-directory: Du_an_2_Breast_Cancer/database
      - name: PostgreSQL smoke test
        run: python Du_an_2_Breast_Cancer/database/tests/postgres_smoke.py
        env:
          DATABASE_URL: postgresql://test_runner@127.0.0.1:5432/integration_test

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check Du_an_2_Breast_Cancer/frontend/script.js
          node --check Du_an_2_Breast_Cancer/frontend/build-config.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no hardcoded secrets or credentials
        shell: bash
        run: |
          set -euo pipefail
          MATCHES=$(grep -rnE "(OWNER_PASSWORD|JWT_SECRET|SECRET_KEY)[A-Za-z_]*[[:space:]]*[=:][[:space:]]*['\"]?[^[:space:]'\"$]{6,}" \
            --include='*.py' --include='*.yaml' --include='*.yml' --include='*.example' --include='*.md' \
            --exclude-dir=tests --exclude-dir=.git . \
            | grep -vE "your_|os\.getenv|os\.environ|getenv\(|sync: false|<.*>|example\.com|localhost|ci\.yml" || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Security violation: possible hardcoded secret or password."
            exit 1
          fi
          if grep -rnE "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}" --exclude-dir=.git .; then
            echo "Security violation: private key or provider token committed."
            exit 1
          fi
          if grep -rnE "[A]dmin@|identity[_]service_secret_key" --exclude-dir=.git .; then
            echo "Security violation: known leaked credential detected."
            exit 1
          fi
